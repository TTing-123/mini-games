<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08131a" />
  <meta name="description" content="BALANCE 悬挂平衡：拖动重物到钩子上，让所有横杆保持水平。" />
  <title>BALANCE — 悬挂平衡</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="kicker">HANGING BALANCE / PHYSICS PUZZLE</p>
        <h1>BALANCE <span>悬挂平衡</span></h1>
      </div>
      <div class="topbar-right">
        <div class="level-chip"><span>关卡</span><b id="level-label">1 / 8</b></div>
        <button id="reset" class="ghost" type="button">重来</button>
        <button id="next" class="primary" type="button" disabled>下一关</button>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-wrap">
        <canvas id="board" width="900" height="620" aria-label="BALANCE 悬挂平衡棋盘"></canvas>
      </div>

      <aside class="side-panel">
        <section class="panel-block">
          <p class="label">目标</p>
          <div class="goal">
            <span class="balance-icon"></span>
            <div>
              <b>所有横杆水平</b>
              <small>重的一边会沉下去</small>
            </div>
          </div>
        </section>

        <section class="panel-block">
          <p class="label">操作</p>
          <div class="tip">
            <b>拖动重物</b>
            <small>放到空钩子上；再拖走可以取下</small>
          </div>
        </section>

        <section class="panel-block">
          <p class="label">当前关</p>
          <div id="level-title" class="level-title">一边一个</div>
          <p id="level-hint" class="level-hint">把右边的空钩子补齐</p>
        </section>
      </aside>
    </section>
  </main>

  <section id="solved" class="overlay is-hidden">
    <div class="result-panel">
      <p class="kicker">平衡达成</p>
      <h2 id="solved-title">全部水平</h2>
      <p id="solved-text">所有横杆同时保持平衡。</p>
      <div class="result-actions">
        <button id="solved-next" class="primary" type="button">下一关</button>
        <button id="solved-retry" class="ghost" type="button">再看一遍</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
