<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071219" />
  <meta name="description" content="SWAP 换位：WASD 移动，点击视野里的箱子、敌人或钥匙，和它交换位置。" />
  <title>SWAP — 换位</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="kicker">ACTION PUZZLE / SWAP POSITION</p>
        <h1>SWAP <span>换位</span></h1>
      </div>
      <div class="topbar-right">
        <div class="stat-chip"><span>关卡</span><b id="level-label">1 / 5</b></div>
        <div class="stat-chip hearts" id="hearts" aria-label="生命"></div>
        <div class="stat-chip"><span>时间</span><b id="time-label">0.0</b></div>
        <div class="stat-chip"><span>换位</span><b id="swap-label">0</b></div>
        <div class="stat-chip"><span>钥匙</span><b id="key-label">0/1</b></div>
        <button id="restart" class="ghost" type="button">重来</button>
        <button id="next" class="primary" type="button" disabled>下一关</button>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-wrap">
        <canvas id="board" width="810" height="540" aria-label="SWAP 换位棋盘"></canvas>
      </div>

      <aside class="side-panel">
        <section class="panel-block">
          <p class="label">操作</p>
          <div class="tip"><b>WASD / 方向键</b><small>移动</small></div>
          <div class="tip"><b>点击目标</b><small>和箱子、敌人或钥匙交换位置</small></div>
          <div class="tip"><b>R</b><small>重来当前关</small></div>
        </section>

        <section class="panel-block">
          <p class="label">当前关</p>
          <div id="level-title" class="level-title">跨过缺口</div>
          <p id="level-hint" class="level-hint">点击远处的箱子，和它换位</p>
        </section>

        <section class="panel-block">
          <p class="label">目标</p>
          <p class="tip">拿到全部钥匙，然后走到出口。箱子可以填坑，敌人可以被换到尖刺或坑里。</p>
        </section>

        <section class="panel-block">
          <p class="label">跳关</p>
          <div id="level-grid" class="level-grid"></div>
        </section>
      </aside>
    </section>
  </main>

  <section id="result" class="overlay is-hidden">
    <div class="result-panel">
      <p id="result-kicker" class="kicker">关卡完成</p>
      <h2 id="result-title">通过</h2>
      <p id="result-text"></p>
      <p id="result-stars" class="stars"></p>
      <div class="result-actions">
        <button id="result-next" class="primary" type="button">下一关</button>
        <button id="result-retry" class="ghost" type="button">重来</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
