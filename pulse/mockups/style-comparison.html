<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Pulse Style Comparison</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111;font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;color:#111}
.sheet{width:1280px;height:720px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;background:#111}
.panel{position:relative;overflow:hidden;padding:22px;border:3px solid #111}
.panel h2{position:absolute;left:20px;top:14px;margin:0;font-size:22px;letter-spacing:.08em}
.board{position:absolute;inset:58px 22px 22px 22px;border:3px solid currentColor}
.block{position:absolute;display:grid;place-items:center;font-weight:900;font-size:22px}
.tag{position:absolute;padding:5px 9px;white-space:nowrap;font-size:15px;font-weight:900}
.t-red{background:#e84a43;color:#fff}.t-blue{background:#4aa8ea;color:#fff}.t-purple{background:#8156c7;color:#fff}.t-yellow{background:#e8bd30;color:#111}.t-green{background:#42b96a;color:#fff}
.p1{background:#fff5cf;color:#251b2f}.p1 .board{background:radial-gradient(circle at 70% 30%,#fffbd9,#ffdc77);border-radius:22px}.p1 .block{border-radius:18px;box-shadow:6px 7px 0 #251b2f}.p1 .tag{background:#fff;border:3px solid #251b2f;border-radius:14px;box-shadow:3px 4px 0 #251b2f}
.p2{background:#f2efe7;color:#111;background-image:radial-gradient(#aaa 1px,transparent 1px);background-size:12px 12px}.p2 .board{background:#fff;transform:rotate(-.5deg)}.p2 .block{border:4px solid #111;box-shadow:4px 4px 0 #111}.p2 .tag{background:#fff;border:3px solid #111;transform:rotate(-3deg)}
.p3{background:#061d25;color:#d7f9ff;background-image:radial-gradient(rgba(105,220,230,.22) 1px,transparent 1px);background-size:16px 16px}.p3 .board{background:#082c37;border-color:#59d9e5;border-radius:50% 50% 12px 12px;box-shadow:inset 0 0 38px rgba(89,217,229,.25)}.p3 .block{border-radius:50%;box-shadow:0 0 22px currentColor}.p3 .tag{background:#d9fdff;color:#06222a;border-radius:999px;border:2px solid #59d9e5}
.p4{background:#2e3134;color:#fff;background-image:linear-gradient(135deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.05) 50%,rgba(255,255,255,.05) 75%,transparent 75%);background-size:26px 26px}.p4 .board{background:#202326;border:4px solid #fff;transform:skew(-2deg)}.p4 .block{border:3px solid #fff;transform:rotate(-5deg)}.p4 .tag{background:#111;border:3px solid #fff;transform:rotate(-4deg);text-shadow:2px 2px 0 #111}
.r{width:70px;height:70px;border-radius:50%}.b{width:72px;height:72px;border-radius:50%}.p{width:110px;height:110px;border-radius:50%;background:transparent;border:12px solid #8156c7;color:#8156c7}.y{width:60px;height:60px;transform:rotate(45deg);border-radius:8px}.g{width:64px;height:64px;border-radius:50%}
.p1 .tag{color:#251b2f}.p2 .tag{color:#111}.p3 .tag{color:#06222a}.p4 .tag{color:#fff}
</style>
</head>
<body><div class="sheet"><section class="panel p1"><h2>01 潮玩街机</h2><div class="board"></div><div class="block r t-red" style="left:18%;top:18%">击破</div><div class="tag t-red" style="left:34%;top:19%">红核 · 击破</div><div class="block b t-blue" style="left:18%;top:50%">弹</div><div class="tag t-blue" style="left:34%;top:51%">蓝块 · 反弹</div><div class="block p" style="left:52%;top:26%">吸</div><div class="tag t-purple" style="left:70%;top:27%">紫块 · 引力</div><div class="block y t-yellow" style="left:57%;top:65%">分</div><div class="tag t-yellow" style="left:68%;top:66%">黄块 · 分裂</div><div class="block g t-green" style="left:79%;top:51%">＋1</div><div class="tag t-green" style="left:69%;top:78%">绿块 · 补发</div></section>
<section class="panel p2"><h2>02 漫画分镜</h2><div class="board"></div><div class="block r t-red" style="left:18%;top:18%">击破</div><div class="tag t-red" style="left:34%;top:19%">目标在这里</div><div class="block b t-blue" style="left:18%;top:50%">弹</div><div class="tag t-blue" style="left:34%;top:51%">撞它会弹走</div><div class="block p" style="left:52%;top:26%">吸</div><div class="tag t-purple" style="left:70%;top:27%">这里会拉弯</div><div class="block y t-yellow" style="left:57%;top:65%">分</div><div class="tag t-yellow" style="left:68%;top:66%">一球变两球</div><div class="block g t-green" style="left:79%;top:51%">＋1</div><div class="tag t-green" style="left:68%;top:78%">多发一次</div></section>
<section class="panel p3"><h2>03 深海实验室</h2><div class="board"></div><div class="block r t-red" style="left:18%;top:18%">击破</div><div class="tag t-red" style="left:34%;top:19%">目标体</div><div class="block b t-blue" style="left:18%;top:50%">弹</div><div class="tag t-blue" style="left:34%;top:51%">反射膜</div><div class="block p" style="left:52%;top:26%">吸</div><div class="tag t-purple" style="left:70%;top:27%">重力吸引</div><div class="block y t-yellow" style="left:57%;top:65%">分</div><div class="tag t-yellow" style="left:68%;top:66%">细胞分裂</div><div class="block g t-green" style="left:79%;top:51%">＋1</div><div class="tag t-green" style="left:68%;top:78%">能量补给</div></section>
<section class="panel p4"><h2>04 街头涂鸦</h2><div class="board"></div><div class="block r t-red" style="left:18%;top:18%">击</div><div class="tag t-red" style="left:34%;top:19%">打爆红核</div><div class="block b t-blue" style="left:18%;top:50%">弹</div><div class="tag t-blue" style="left:34%;top:51%">撞就反弹</div><div class="block p" style="left:52%;top:26%">引</div><div class="tag t-purple" style="left:70%;top:27%">拉弯轨迹</div><div class="block y t-yellow" style="left:57%;top:65%">裂</div><div class="tag t-yellow" style="left:68%;top:66%">炸成两颗</div><div class="block g t-green" style="left:79%;top:51%">＋1</div><div class="tag t-green" style="left:68%;top:78%">再来一发</div></section>
</div></body></html>
