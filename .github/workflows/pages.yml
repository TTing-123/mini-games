name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run game tests
        run: node --test pulse/tests/*.test.mjs casebook/tests/*.test.mjs route/tests/*.test.mjs
      - name: Stage static site
        run: |
          mkdir -p _site/pulse
          cp index.html favicon.svg _site/
          cp pulse/index.html pulse/favicon.svg _site/pulse/
          cp -R pulse/src _site/pulse/src
          mkdir -p _site/casebook
          cp casebook/index.html casebook/favicon.svg _site/casebook/
          cp -R casebook/src _site/casebook/src
          mkdir -p _site/route
          cp route/index.html route/favicon.svg _site/route/
          cp -R route/src _site/route/src
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4