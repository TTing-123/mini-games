<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071219" />
  <meta name="description" content="NONO 数织：根据每行每列的连续块数字，填出隐藏像素图。" />
  <title>NONO — 数织</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="kicker">GRID LOGIC / PIXEL REVEAL</p>
        <h1>NONO <span>数织</span></h1>
      </div>
      <div class="topbar-right">
        <div class="stat-chip"><span>关卡</span><b id="level-label">0 / 40</b></div>
        <button id="hint" class="ghost" type="button">提示</button>
        <button id="restart" class="ghost" type="button">重来</button>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="数织棋盘"></div>
      </div>

      <aside class="side-panel">
        <section class="panel-block">
          <p class="label">怎么玩</p>
          <p class="tip">数字表示这一行或这一列里，连续填色块的长度。比如 <b>3</b> 就是连续三格。</p>
        </section>

        <section class="panel-block">
          <p class="label">操作</p>
          <p class="tip"><b>左键：</b>点亮或取消点亮。<br>按住拖动可以连续操作。</p>
        </section>

        <section class="panel-block">
          <p class="label">当前关</p>
          <div id="level-title" class="level-title">爱心</div>
          <p id="level-hint" class="level-hint">先从最满的行开始</p>
        </section>

        <section class="panel-block">
          <p class="label">跳关</p>
          <div id="level-grid" class="level-grid"></div>
        </section>
      </aside>
    </section>
  </main>

  <section id="result" class="overlay is-hidden">
    <div class="result-panel">
      <p class="kicker">图案完成</p>
      <h2 id="result-title">爱心</h2>
      <p id="result-text"></p>
      <div class="result-actions">
        <button id="result-next" class="primary" type="button">下一关</button>
        <button id="result-retry" class="ghost" type="button">重来</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
