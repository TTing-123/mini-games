<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020c11" />
  <meta name="description" content="Prism：拖镜子改光路，让每种颜色照到对应的目标。" />
  <title>PRISM — 光路与颜色</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="stage">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <header class="hud">
      <div class="hud-panel">
        <div class="hud-label">LIT</div>
        <div id="lit-counter" class="hud-number">0/3</div>
      </div>
      <div id="level-badge" class="level-badge">LEVEL 1</div>
    </header>
    <div id="banner" class="banner">ALL LIT</div>
    <nav class="toolbar" aria-label="关卡控制">
      <button id="levels-button" class="tool-button" type="button">LEVELS</button>
      <button id="next-button" class="tool-button tool-primary is-hidden" type="button">NEXT LEVEL</button>
    </nav>
    <section id="level-panel" class="overlay is-hidden" aria-label="选择关卡">
      <div class="overlay-card">
        <div class="overlay-kicker">SELECT LEVEL</div>
        <div id="level-grid" class="level-grid"></div>
        <button id="level-close" class="overlay-close" type="button">CLOSE</button>
      </div>
    </section>
    <div id="hint" class="hint">拖动镜子 · 轻点翻面</div>
  </main>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
