<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071219" />
  <meta name="description" content="SURGE 推潮棋：落子后推整行或整列，青线接上下，琥珀线接左右。" />
  <title>SURGE — 推潮棋</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="kicker">ABSTRACT DUEL / 07 × 07</p>
        <h1>SURGE <span>推潮棋</span></h1>
      </div>
      <div class="topbar-right">
        <div id="turn-chip" class="turn-chip">
          <span class="turn-dot"></span>
          <span id="turn-label">你的回合</span>
        </div>
        <button id="restart" class="ghost" type="button">重开</button>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-wrap">
        <div class="edge-label edge-top"><span>青线</span><i></i></div>
        <div class="edge-label edge-left"><span>琥珀线</span><i></i></div>
        <canvas id="board" width="700" height="700" aria-label="SURGE 推潮棋棋盘"></canvas>
        <div class="edge-label edge-right"><span>琥珀线</span><i></i></div>
        <div class="edge-label edge-bottom"><span>青线</span><i></i></div>
      </div>

      <aside class="side-panel">
        <section class="panel-block">
          <p class="label">目标</p>
          <div class="goal">
            <span class="stone cyan"></span>
            <div><b>青线接上下</b><small>从顶边连到底边</small></div>
          </div>
          <div class="goal">
            <span class="stone amber"></span>
            <div><b>琥珀线接左右</b><small>从左边连到右边</small></div>
          </div>
        </section>

        <section class="panel-block">
          <p class="label">怎么下</p>
          <ol class="steps">
            <li><b>按住</b>任意空格</li>
            <li><b>拖动</b>到行或列的方向</li>
            <li><b>松手</b>，整条线推一格</li>
          </ol>
        </section>

        <section class="panel-block stats">
          <p class="label">局面</p>
          <div class="stat"><span>手数</span><b id="ply">0</b></div>
          <div class="stat"><span>状态</span><b id="state-label">你先</b></div>
        </section>
      </aside>
    </section>

    <p id="hint" class="hint">按住空格，向一个方向拖一格。棋子被推到边缘外会消失。</p>
  </main>

  <section id="result" class="overlay is-hidden">
    <div class="result-panel">
      <p id="result-kicker" class="kicker">对局结束</p>
      <h2 id="result-title">你赢了</h2>
      <p id="result-text"></p>
      <div class="result-actions">
        <button id="again" class="primary" type="button">再来一局</button>
      </div>
    </div>
  </section>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
